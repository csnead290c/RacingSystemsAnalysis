<!DOCTYPE html>
<html>
<head>
    <title>Formula Verification</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; font-size: 11px; }
        pre { background: #2d2d30; padding: 10px; white-space: pre; line-height: 1.4; }
        .section { margin: 20px 0; border: 1px solid #444; padding: 10px; }
        h3 { color: #4ec9b0; margin: 5px 0; }
        .diff { color: #f48771; }
    </style>
</head>
<body>
    <h1>Detailed Formula Verification - First Iteration</h1>
    <div id="output"></div>
    
    <script type="module">
        const { CONSTANTS, CAM_FACTORS, calcGulp } = await import('/src/domain/physics/engine/engineConstants.ts');
        
        // Test inputs
        const noCyl = 8, inline = 0, bore = 4.03, stroke = 3.48, rod = 5.85;
        const compressionRatio = 12.9, camType = 4, inCamDur = 264;
        const carbCFM = 750, fuel = 1, manifold = 1, curved = true;
        const manFlow = 96, noInValves = 1, valveDia = 2.05, maxInFlow = 250;
        const deltaP = 28, refBore = 4.0;
        
        let output = '';
        
        // Basic geometry
        const BQS = bore / stroke;
        const B2QS = bore * BQS;
        const S3QB = Math.pow(stroke, 2) / BQS;
        const LRQS = rod / stroke;
        const flrqs = 1 + Math.pow(0.348 / LRQS, 1.99);
        const BArea = CONSTANTS.PI * Math.pow(bore, 2) / 4;
        const CID = BArea * stroke * noCyl;
        
        output += '<div class="section">';
        output += '<h3>Basic Geometry</h3>';
        output += '<pre>';
        output += `BQS = ${bore} / ${stroke} = ${BQS.toFixed(6)}\n`;
        output += `B2QS = ${bore} * ${BQS.toFixed(6)} = ${B2QS.toFixed(6)}\n`;
        output += `S3QB = ${stroke}^2 / ${BQS.toFixed(6)} = ${S3QB.toFixed(6)}\n`;
        output += `LRQS = ${rod} / ${stroke} = ${LRQS.toFixed(6)}\n`;
        output += `flrqs = 1 + (0.348 / ${LRQS.toFixed(6)})^1.99 = ${flrqs.toFixed(6)}\n`;
        output += `BArea = PI * ${bore}^2 / 4 = ${BArea.toFixed(6)}\n`;
        output += `CID = ${BArea.toFixed(6)} * ${stroke} * ${noCyl} = ${CID.toFixed(6)}\n`;
        output += '</pre>';
        output += '</div>';
        
        // Fuel properties
        const GAM = 1.28, aqf = 14.7, fhv = 20700, crx = 11.5;
        const hpcfmx = CONSTANTS.RHOair * fhv / (550 * aqf) * 778.16 / 60;
        const tqcidx = hpcfmx * CONSTANTS.Z6 / (2 * 1728);
        const crvf = 1 + 1 / (compressionRatio - 1);
        
        output += '<div class="section">';
        output += '<h3>Fuel & Constants</h3>';
        output += '<pre>';
        output += `hpcfmx = ${CONSTANTS.RHOair} * ${fhv} / (550 * ${aqf}) * 778.16 / 60 = ${hpcfmx.toFixed(6)}\n`;
        output += `tqcidx = ${hpcfmx.toFixed(6)} * ${CONSTANTS.Z6} / (2 * 1728) = ${tqcidx.toFixed(6)}\n`;
        output += `crvf = 1 + 1 / (${compressionRatio} - 1) = ${crvf.toFixed(6)}\n`;
        output += '</pre>';
        output += '</div>';
        
        // Initial iteration values
        const Gulp = calcGulp(manifold, noCyl);
        const clk = (1.5 / 29.92) / Math.pow(carbCFM, 2);
        let CarbVETQ = 1 - Math.pow(0.135 * CID * crvf / carbCFM, 1.25);
        if (CarbVETQ < 0.65) CarbVETQ = 0.65;
        let PortVETQ = 0.987;
        let lcetq = 1;
        
        output += '<div class="section">';
        output += '<h3>Initial Values</h3>';
        output += '<pre>';
        output += `Gulp = ${Gulp}\n`;
        output += `clk = (1.5 / 29.92) / ${carbCFM}^2 = ${clk.toFixed(9)}\n`;
        output += `CarbVETQ = 1 - (0.135 * ${CID.toFixed(2)} * ${crvf.toFixed(4)} / ${carbCFM})^1.25 = ${CarbVETQ.toFixed(6)}\n`;
        output += `PortVETQ = ${PortVETQ}\n`;
        output += `lcetq = ${lcetq}\n`;
        output += '</pre>';
        output += '</div>';
        
        // First iteration TQ calculation
        const itr = 1;
        let xqs = 1;
        const ivc = 109 + 1.08 * inCamDur / 2;
        if (ivc > 180) {
            const ivcr = ivc * CONSTANTS.PI / 180;
            xqs = (1 + 2 * LRQS - Math.cos(ivcr) - Math.sqrt(Math.pow(2 * LRQS, 2) - Math.pow(Math.sin(ivcr), 2))) / 2;
        }
        
        output += '<div class="section">';
        output += '<h3>Iteration 1 - xqs Calculation</h3>';
        output += '<pre>';
        output += `ivc = 109 + 1.08 * ${inCamDur} / 2 = ${ivc.toFixed(6)}\n`;
        if (ivc > 180) {
            output += `ivcr = ${ivc.toFixed(6)} * PI / 180 = ${(ivc * CONSTANTS.PI / 180).toFixed(6)}\n`;
            output += `xqs = (1 + 2*${LRQS.toFixed(6)} - cos(ivcr) - sqrt((2*LRQS)^2 - sin(ivcr)^2)) / 2\n`;
            output += `xqs = ${xqs.toFixed(6)}\n`;
        } else {
            output += `xqs = 1 (ivc <= 180)\n`;
        }
        output += '</pre>';
        output += '</div>';
        
        // VB6 Expected values for comparison
        output += '<div class="section">';
        output += '<h3>VB6 Expected Output</h3>';
        output += '<pre>';
        output += `Peak HP: 461 @ 6650 RPM\n`;
        output += `Peak TQ: 415 @ 5450 RPM\n\n`;
        output += `TypeScript Current Output:\n`;
        output += `Peak HP: 451 @ 6600 RPM (${451-461} HP, ${6600-6650} RPM)\n`;
        output += `Peak TQ: 410 @ 5400 RPM (${410-415} TQ, ${5400-5450} RPM)\n`;
        output += '</pre>';
        output += '</div>';
        
        output += '<div class="section">';
        output += '<h3>Analysis</h3>';
        output += '<pre>';
        output += 'Since Single precision emulation had ZERO effect, the issue is:\n';
        output += '  1. A formula difference (coefficient, exponent, or term)\n';
        output += '  2. A calculation order issue\n';
        output += '  3. A missing or extra calculation\n\n';
        output += 'The consistent -10 HP, -50 RPM pattern suggests a systematic\n';
        output += 'error that compounds through iterations.\n\n';
        output += 'Next: Need VB6 debug output for iteration 1 to compare\n';
        output += 'intermediate values and find the exact divergence point.\n';
        output += '</pre>';
        output += '</div>';
        
        document.getElementById('output').innerHTML = output;
    </script>
</body>
</html>
