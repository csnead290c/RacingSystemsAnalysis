<!DOCTYPE html>
<html>
<head>
    <title>Iteration Trace</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; font-size: 10px; }
        pre { background: #2d2d30; padding: 10px; overflow-x: auto; white-space: pre; }
        .iter { color: #4ec9b0; font-weight: bold; }
        .value { color: #ce9178; }
    </style>
</head>
<body>
    <h2>Iteration-by-Iteration Trace (Curved Runners)</h2>
    <pre id="output"></pre>
    
    <script type="module">
        const { calcEngPerf } = await import('/src/domain/physics/engine/enginePerf.ts');
        
        // Test with curved runners (matching VB6 screenshot)
        const inputs = {
            noCyl: 8, inline: 0, bore: 4.03, stroke: 3.48, rod: 5.85,
            compressionRatio: 12.9, camType: 4, inCamDur: 264,
            carb: true, carbCFM: 750, fuel: 1, manifold: 1, curved: true,
            manFlow: 96, noInValves: 1, valveDia: 2.05, maxInFlow: 250,
            deltaP: 28, refBore: 4.0, deck: 0.015, gasket: 0.039,
            chamber: 62, dome: 12,
        };
        
        const result = calcEngPerf(inputs);
        
        let output = 'TypeScript Result (Curved Runners):\n';
        output += `  Peak HP: ${Math.round(result.peakHP)} @ ${result.rpmPeakHP} RPM\n`;
        output += `  Peak TQ: ${Math.round(result.peakTQ)} @ ${result.rpmPeakTQ} RPM\n`;
        output += `  Shift: ${result.shift} RPM, Redline: ${result.redline} RPM\n\n`;
        
        output += 'VB6 Expected (from screenshot):\n';
        output += '  Peak HP: 461 @ 6650 RPM\n';
        output += '  Peak TQ: 415 @ 5450 RPM\n';
        output += '  Shift: 7200 RPM, Redline: 8350 RPM\n\n';
        
        output += 'Discrepancies:\n';
        output += `  HP: ${Math.round(result.peakHP) - 461} HP\n`;
        output += `  TQ: ${Math.round(result.peakTQ) - 415} lb-ft\n`;
        output += `  HP RPM: ${result.rpmPeakHP - 6650} RPM\n`;
        output += `  TQ RPM: ${result.rpmPeakTQ - 5450} RPM\n\n`;
        
        output += '='.repeat(80) + '\n';
        output += 'ANALYSIS:\n';
        output += '='.repeat(80) + '\n\n';
        
        output += 'The systematic error pattern (7-10 HP low, 50 RPM low) suggests:\n';
        output += '1. A missing multiplier factor in the core calculations\n';
        output += '2. An incorrect exponent in one of the formulas\n';
        output += '3. A subtle difference in calculation order\n\n';
        
        output += 'To identify the exact issue, we need VB6 debug output showing:\n';
        output += '- Intermediate values for each iteration (tqfps, hpfps, metq, mehp)\n';
        output += '- RamVETQ, RamVEHP, VETQ, VEHP values\n';
        output += '- EffCR, EFF values\n';
        output += '- NTQ[1], NTQ[2], NHP[1], NHP[2] values\n\n';
        
        output += 'Please run the VB6 program with the debug script from:\n';
        output += 'docs/VB6_DEBUG_SCRIPT.md\n\n';
        
        output += 'This will show exactly where the TypeScript calculation diverges.\n';
        
        document.getElementById('output').textContent = output;
        console.log(output);
    </script>
</body>
</html>
