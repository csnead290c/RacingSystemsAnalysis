<!DOCTYPE html>
<html>
<head>
    <title>VB6 Precision Final Test</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        table { border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 8px 12px; text-align: left; border: 1px solid #444; }
        th { background: #2d2d30; }
        .pass { color: #4ec9b0; font-weight: bold; }
        .fail { color: #f48771; font-weight: bold; }
        pre { background: #2d2d30; padding: 10px; }
        h1 { color: #4ec9b0; }
        h2 { color: #dcdcaa; }
    </style>
</head>
<body>
    <h1>VB6 Single Precision Emulation - Final Test</h1>
    <div id="output"></div>
    
    <script type="module">
        const { calcEngPerf } = await import('/src/domain/physics/engine/enginePerf.ts');
        const { calcEngPerfVB6 } = await import('/src/domain/physics/engine/enginePerfVB6.ts');
        
        const inputs = {
            noCyl: 8, inline: 0, bore: 4.03, stroke: 3.48, rod: 5.85,
            compressionRatio: 12.9, camType: 4, inCamDur: 264,
            carb: true, carbCFM: 750, fuel: 1, manifold: 1, curved: true,
            manFlow: 96, noInValves: 1, valveDia: 2.05, maxInFlow: 250,
            deltaP: 28, refBore: 4.0, deck: 0.015, gasket: 0.039,
            chamber: 62, dome: 12,
        };
        
        console.log('Running calculations...');
        const normalResult = calcEngPerf(inputs);
        const vb6Result = calcEngPerfVB6(inputs);
        
        let html = '<h2>Results Comparison</h2>';
        html += '<table>';
        html += '<tr><th>Version</th><th>Peak HP</th><th>HP RPM</th><th>Peak TQ</th><th>TQ RPM</th><th>Shift</th><th>Redline</th></tr>';
        
        html += '<tr>';
        html += '<td>Original TypeScript (double)</td>';
        html += `<td>${Math.round(normalResult.peakHP)}</td>`;
        html += `<td>${normalResult.rpmPeakHP}</td>`;
        html += `<td>${Math.round(normalResult.peakTQ)}</td>`;
        html += `<td>${normalResult.rpmPeakTQ}</td>`;
        html += `<td>${normalResult.shift}</td>`;
        html += `<td>${normalResult.redline}</td>`;
        html += '</tr>';
        
        html += '<tr>';
        html += '<td><strong>VB6 Single Precision</strong></td>';
        html += `<td><strong>${Math.round(vb6Result.peakHP)}</strong></td>`;
        html += `<td><strong>${vb6Result.rpmPeakHP}</strong></td>`;
        html += `<td><strong>${Math.round(vb6Result.peakTQ)}</strong></td>`;
        html += `<td><strong>${vb6Result.rpmPeakTQ}</strong></td>`;
        html += `<td><strong>${vb6Result.shift}</strong></td>`;
        html += `<td><strong>${vb6Result.redline}</strong></td>`;
        html += '</tr>';
        
        html += '<tr style="background: #2d2d30;">';
        html += '<td><strong>VB6 Expected</strong></td>';
        html += '<td><strong>461</strong></td>';
        html += '<td><strong>6650</strong></td>';
        html += '<td><strong>415</strong></td>';
        html += '<td><strong>5450</strong></td>';
        html += '<td><strong>7200</strong></td>';
        html += '<td><strong>8350</strong></td>';
        html += '</tr>';
        
        html += '</table>';
        
        html += '<h2>Accuracy Check</h2>';
        html += '<table>';
        html += '<tr><th>Metric</th><th>VB6 Single</th><th>VB6 Expected</th><th>Difference</th><th>Match?</th></tr>';
        
        const metrics = [
            { name: 'Peak HP', value: Math.round(vb6Result.peakHP), expected: 461, tol: 1 },
            { name: 'HP RPM', value: vb6Result.rpmPeakHP, expected: 6650, tol: 0 },
            { name: 'Peak TQ', value: Math.round(vb6Result.peakTQ), expected: 415, tol: 1 },
            { name: 'TQ RPM', value: vb6Result.rpmPeakTQ, expected: 5450, tol: 0 },
            { name: 'Shift RPM', value: vb6Result.shift, expected: 7200, tol: 0 },
            { name: 'Redline', value: vb6Result.redline, expected: 8350, tol: 0 },
        ];
        
        let allMatch = true;
        metrics.forEach(m => {
            const diff = m.value - m.expected;
            const match = Math.abs(diff) <= m.tol;
            if (!match) allMatch = false;
            
            html += '<tr>';
            html += `<td>${m.name}</td>`;
            html += `<td>${m.value}</td>`;
            html += `<td>${m.expected}</td>`;
            html += `<td>${diff > 0 ? '+' : ''}${diff}</td>`;
            html += `<td class="${match ? 'pass' : 'fail'}">${match ? '✓ PASS' : '✗ FAIL'}</td>`;
            html += '</tr>';
        });
        
        html += '</table>';
        
        html += '<pre>';
        if (allMatch) {
            html += '\n';
            html += '═══════════════════════════════════════════════════════════\n';
            html += '   ✓✓✓ 100% VB6 PARITY ACHIEVED! ✓✓✓\n';
            html += '═══════════════════════════════════════════════════════════\n\n';
            html += 'The VB6 Single precision emulation successfully matches\n';
            html += 'the original VB6 ENGPERF.BAS output exactly!\n\n';
            html += 'All metrics match within tolerance:\n';
            html += '  • Peak HP: EXACT MATCH\n';
            html += '  • Peak TQ: EXACT MATCH\n';
            html += '  • HP RPM: EXACT MATCH\n';
            html += '  • TQ RPM: EXACT MATCH\n';
            html += '  • Shift RPM: EXACT MATCH\n';
            html += '  • Redline: EXACT MATCH\n';
        } else {
            html += '\n';
            html += 'VB6 Single precision emulation results:\n\n';
            html += 'Improvement from double precision:\n';
            html += `  HP: ${Math.round(normalResult.peakHP)} → ${Math.round(vb6Result.peakHP)} (${Math.round(vb6Result.peakHP) - Math.round(normalResult.peakHP) > 0 ? '+' : ''}${Math.round(vb6Result.peakHP) - Math.round(normalResult.peakHP)})\n`;
            html += `  TQ: ${Math.round(normalResult.peakTQ)} → ${Math.round(vb6Result.peakTQ)} (${Math.round(vb6Result.peakTQ) - Math.round(normalResult.peakTQ) > 0 ? '+' : ''}${Math.round(vb6Result.peakTQ) - Math.round(normalResult.peakTQ)})\n`;
            html += `  HP RPM: ${normalResult.rpmPeakHP} → ${vb6Result.rpmPeakHP} (${vb6Result.rpmPeakHP - normalResult.rpmPeakHP > 0 ? '+' : ''}${vb6Result.rpmPeakHP - normalResult.rpmPeakHP})\n`;
            html += `  TQ RPM: ${normalResult.rpmPeakTQ} → ${vb6Result.rpmPeakTQ} (${vb6Result.rpmPeakTQ - normalResult.rpmPeakTQ > 0 ? '+' : ''}${vb6Result.rpmPeakTQ - normalResult.rpmPeakTQ})\n\n`;
            
            html += 'Remaining discrepancy from VB6:\n';
            metrics.forEach(m => {
                const diff = m.value - m.expected;
                if (Math.abs(diff) > m.tol) {
                    html += `  ${m.name}: ${diff > 0 ? '+' : ''}${diff}\n`;
                }
            });
        }
        html += '</pre>';
        
        document.getElementById('output').innerHTML = html;
        
        console.log('Normal Result:', normalResult);
        console.log('VB6 Result:', vb6Result);
        console.log('All Match:', allMatch);
    </script>
</body>
</html>
