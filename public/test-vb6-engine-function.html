<!DOCTYPE html>
<html>
<head>
    <title>VB6 ENGINE Function Test</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; }
        table { border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: right; }
        th { background: #f0f0f0; }
        .header { font-weight: bold; margin: 20px 0 10px 0; }
    </style>
</head>
<body>
    <h1>VB6 ENGINE Function Test</h1>
    <p>Testing the initial 29-point curve generation from VB6 Cgraph.CLS ENGINE subroutine</p>
    
    <div class="header">Test Parameters:</div>
    <div id="params"></div>
    
    <div class="header">Initial 29-Point Curve (from ENGINE function):</div>
    <table id="curveTable">
        <tr>
            <th>n</th>
            <th>RPMR</th>
            <th>RPM</th>
            <th>TQR</th>
            <th>TQ</th>
        </tr>
    </table>
    
    <div class="header">Peak Values on Initial Curve:</div>
    <div id="peaks"></div>

    <script type="module">
        import { generateVB6DynoCurve } from '/src/domain/physics/engine/vb6CurveGen.ts';
        import { CONSTANTS } from '/src/domain/physics/engine/engineConstants.ts';

        // Test case from user's VB6 screenshot
        const peakHP = 461;
        const rpmAtPeakHP = 6650;
        const peakTQ = 415;
        const rpmAtPeakTQ = 5450;
        const redlineRPM = 7200;
        const CID = 355.1;

        document.getElementById('params').innerHTML = `
            Peak HP: ${peakHP} @ ${rpmAtPeakHP} RPM<br>
            Peak TQ: ${peakTQ} @ ${rpmAtPeakTQ} RPM<br>
            Redline: ${redlineRPM} RPM<br>
            Displacement: ${CID} CID<br>
            HP/CID: ${(peakHP / CID).toFixed(3)}
        `;

        // VB6 lookup tables (1-based indexing)
        const SX = [
            0, // dummy for 1-based indexing
            0.25, 0.5, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9,
            0.95, 1.0, 1.02, 1.05, 1.1, 1.15, 1.2, 1.25
        ];

        const sz = [
            0, // dummy for 1-based indexing
            0.7, 1.2, 1.7, 2.5, 3.4
        ];

        const sy = [
            0, // dummy for 1-based indexing
            // sz=0.7 (low HP/CID)
            0.53, 0.975, 1.098, 1.13, 1.152, 1.16, 1.153, 1.122, 1.086,
            1.045, 1.0, 0.978, 0.938, 0.865, 0.795, 0.72, 0.63,
            // sz=1.2
            0.365, 0.87, 1.018, 1.066, 1.11, 1.129, 1.132, 1.11, 1.079,
            1.042, 1.0, 0.977, 0.935, 0.855, 0.762, 0.66, 0.54,
            // sz=1.7
            0.24, 0.79, 0.96, 1.023, 1.08, 1.106, 1.117, 1.102, 1.074,
            1.04, 1.0, 0.976, 0.932, 0.845, 0.736, 0.612, 0.474,
            // sz=2.5
            0.1, 0.7, 0.894, 0.972, 1.04, 1.08, 1.096, 1.09, 1.069,
            1.037, 1.0, 0.974, 0.928, 0.83, 0.698, 0.55, 0.39,
            // sz=3.4 (high HP/CID)
            0, 0.63, 0.84, 0.924, 1.0, 1.055, 1.079, 1.082, 1.064,
            1.035, 1.0, 0.973, 0.923, 0.815, 0.662, 0.49, 0.31
        ];

        // VB6 DTABY function - 2D table interpolation
        function DTABY(x, z, y, nx, nz, kx, kz, xval, zval) {
            // Find X bracket
            let ix = 1;
            for (let i = 1; i <= nx; i++) {
                if (xval >= x[i]) ix = i;
            }
            if (ix >= nx) ix = nx - 1;
            
            // Find Z bracket
            let iz = 1;
            for (let i = 1; i <= nz; i++) {
                if (zval >= z[i]) iz = i;
            }
            if (iz >= nz) iz = nz - 1;
            
            // Bilinear interpolation
            const x1 = x[ix];
            const x2 = x[ix + 1];
            const z1 = z[iz];
            const z2 = z[iz + 1];
            
            const fx = (xval - x1) / (x2 - x1);
            const fz = (zval - z1) / (z2 - z1);
            
            // Get four corner values
            const y11 = y[ix + (iz - 1) * nx];
            const y21 = y[ix + 1 + (iz - 1) * nx];
            const y12 = y[ix + iz * nx];
            const y22 = y[ix + 1 + iz * nx];
            
            // Interpolate
            const y1 = y11 + fx * (y21 - y11);
            const y2 = y12 + fx * (y22 - y12);
            const yval = y1 + fz * (y2 - y1);
            
            return yval;
        }

        // VB6 ENGINE function - Generate 29-point curve
        function ENGINE_VB6(peakHP, rpmAtPeakHP, CID) {
            const RPM = new Array(30).fill(0);  // 1-based, 29 points
            const TQ = new Array(30).fill(0);   // 1-based, 29 points
            
            const TQPHP = CONSTANTS.Z6 * peakHP / rpmAtPeakHP;
            let HPCID = peakHP / CID;
            
            // Clamp HP/CID to table range
            if (HPCID < sz[1]) HPCID = sz[1];
            if (HPCID > sz[5]) HPCID = sz[5];
            
            const results = [];
            
            // Generate odd points (1, 3, 5, ..., 29) - VB6 lines 306-311
            for (let n = 1; n <= 29; n += 2) {
                const idx = (n + 3) / 2;
                const RPMR = SX[idx];
                RPM[n] = RPMR * rpmAtPeakHP;
                const TQR = DTABY(SX, sz, sy, 17, 5, 3, 2, RPMR, HPCID);
                TQ[n] = TQR * TQPHP;
                
                results.push({ n, RPMR, RPM: RPM[n], TQR, TQ: TQ[n] });
            }
            
            // Generate even points (2, 4, 6, ..., 28) - VB6 lines 313-318
            for (let n = 2; n <= 28; n += 2) {
                const idx1 = (n + 2) / 2;
                const idx2 = (n + 4) / 2;
                const RPMR = (SX[idx1] + SX[idx2]) / 2;
                RPM[n] = RPMR * rpmAtPeakHP;
                const TQR = DTABY(SX, sz, sy, 17, 5, 3, 2, RPMR, HPCID);
                TQ[n] = TQR * TQPHP;
                
                results.push({ n, RPMR, RPM: RPM[n], TQR, TQ: TQ[n] });
            }
            
            // Sort by n
            results.sort((a, b) => a.n - b.n);
            
            return { RPM, TQ, results };
        }

        // Run test
        const { RPM, TQ, results } = ENGINE_VB6(peakHP, rpmAtPeakHP, CID);
        
        // Display results
        const table = document.getElementById('curveTable');
        results.forEach(r => {
            const row = table.insertRow();
            row.insertCell().textContent = r.n;
            row.insertCell().textContent = r.RPMR.toFixed(4);
            row.insertCell().textContent = r.RPM.toFixed(1);
            row.insertCell().textContent = r.TQR.toFixed(4);
            row.insertCell().textContent = r.TQ.toFixed(2);
        });
        
        // Find peaks
        let maxTQ = 0;
        let maxTQRPM = 0;
        for (let k = 1; k <= 29; k++) {
            if (TQ[k] > maxTQ) {
                maxTQ = TQ[k];
                maxTQRPM = RPM[k];
            }
        }
        
        document.getElementById('peaks').innerHTML = `
            Peak TQ on initial curve: ${maxTQ.toFixed(2)} lb-ft @ ${maxTQRPM.toFixed(0)} RPM<br>
            Target Peak TQ: ${peakTQ} lb-ft @ ${rpmAtPeakTQ} RPM<br>
            <br>
            DRPM adjustment needed: ${(rpmAtPeakTQ - maxTQRPM).toFixed(1)} RPM<br>
            DTQ adjustment factor: ${((peakTQ / maxTQ - 1) * 100).toFixed(2)}%
        `;
    </script>
</body>
</html>
