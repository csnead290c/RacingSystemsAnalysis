<!DOCTYPE html>
<html>
<head>
    <title>Athroat Calculation Test</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        pre { background: #2d2d30; padding: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Athroat Calculation Verification</h1>
    <pre id="output"></pre>
    
    <script type="module">
        const { VSW, VSTM } = await import('/src/domain/physics/engine/engineConstants.ts');
        
        const PI = 3.141593;
        const valveDia = 2.05;
        const noInValves = 1;
        
        let output = 'VB6 Formula: athroat = niv * (PI / 4) * ivd ^ 2 * (VSW ^ 2 - VSTM)\n\n';
        
        output += 'Constants:\n';
        output += `  PI = ${PI}\n`;
        output += `  VSW = ${VSW}\n`;
        output += `  VSTM = ${VSTM}\n`;
        output += `  valveDia = ${valveDia}\n`;
        output += `  noInValves = ${noInValves}\n\n`;
        
        output += 'Step-by-step calculation:\n';
        output += `  VSW^2 = ${Math.pow(VSW, 2).toFixed(10)}\n`;
        output += `  VSW^2 - VSTM = ${(Math.pow(VSW, 2) - VSTM).toFixed(10)}\n`;
        output += `  valveDia^2 = ${Math.pow(valveDia, 2).toFixed(10)}\n`;
        output += `  PI / 4 = ${(PI / 4).toFixed(10)}\n`;
        output += `  (PI / 4) * valveDia^2 = ${((PI / 4) * Math.pow(valveDia, 2)).toFixed(10)}\n`;
        output += `  athroat = ${(noInValves * (PI / 4) * Math.pow(valveDia, 2) * (Math.pow(VSW, 2) - VSTM)).toFixed(10)}\n\n`;
        
        const athroat_TS = noInValves * (PI / 4) * Math.pow(valveDia, 2) * (Math.pow(VSW, 2) - VSTM);
        
        output += 'TypeScript Result:\n';
        output += `  athroat = ${athroat_TS.toFixed(10)}\n\n`;
        
        // Now test with the exact VB6 calculation
        const athroat_VB6_style = noInValves * (PI / 4) * Math.pow(valveDia, 2) * (Math.pow(VSW, 2) - VSTM);
        
        output += 'VB6-style Result:\n';
        output += `  athroat = ${athroat_VB6_style.toFixed(10)}\n\n`;
        
        output += 'Match: ' + (athroat_TS === athroat_VB6_style ? 'YES' : 'NO') + '\n\n';
        
        // Now calculate ICFM and cdi
        const maxInFlow = 250;
        const deltaP = 28;
        const bore = 4.03;
        const refBore = 4.0;
        
        const yFactor = 1.044429 * (1 - 0.618 * deltaP / 406.78);
        const flowBenchCorr = Math.sqrt(28 / deltaP) * yFactor;
        const ICFM = maxInFlow * flowBenchCorr * Math.pow(bore / refBore, 0.5);
        const cdi = (ICFM / athroat_TS) / 133;
        
        output += '='.repeat(60) + '\n';
        output += 'Full Flow Calculation:\n';
        output += `  maxInFlow = ${maxInFlow}\n`;
        output += `  deltaP = ${deltaP}\n`;
        output += `  yFactor = ${yFactor.toFixed(10)}\n`;
        output += `  flowBenchCorr = ${flowBenchCorr.toFixed(10)}\n`;
        output += `  ICFM = ${ICFM.toFixed(10)}\n`;
        output += `  athroat = ${athroat_TS.toFixed(10)}\n`;
        output += `  cdi = (ICFM / athroat) / 133 = ${cdi.toFixed(10)}\n\n`;
        
        if (cdi > 1) {
            output += `  WARNING: cdi > 1, clamped to 1.0\n`;
        }
        
        document.getElementById('output').textContent = output;
    </script>
</body>
</html>
