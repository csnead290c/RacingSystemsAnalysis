<!DOCTYPE html>
<html>
<head>
    <title>BASECASE.ENG Test</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        table { border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 8px 12px; text-align: left; border: 1px solid #444; }
        th { background: #2d2d30; }
        .pass { color: #4ec9b0; }
        .fail { color: #f48771; }
        pre { background: #2d2d30; padding: 10px; font-size: 11px; }
    </style>
</head>
<body>
    <h1>BASECASE.ENG Verification</h1>
    <div id="output"></div>
    
    <script type="module">
        const { calcEngPerf } = await import('/src/domain/physics/engine/enginePerf.ts');
        
        // BASECASE.ENG inputs (from EPro3w\BASECASE.ENG)
        // Line 3:  8  4.03  3.48  5.85  12.9  750  0 
        // Line 4:  1  250  28  4  96  3  264 
        // Line 7:  4  1.688  1.375  0  730 
        // Note: Line 4 position 6 is manifold=3 (dual plane), Line 7 position 4 is curved=0 (straight)
        // But VB6 SetAllValues() overrides with manifold=1 (common plenum) and curved=True
        
        const basecaseInputs = {
            noCyl: 8,
            inline: 0,  // Vee engine
            bore: 4.03,
            stroke: 3.48,
            rod: 5.85,
            compressionRatio: 12.9,
            camType: 4,  // Normal Flat Tappet & Solid Lifter
            inCamDur: 264,
            carb: true,
            carbCFM: 750,
            fuel: 1,  // Gasoline
            manifold: 1,  // Common plenum (from SetAllValues default)
            curved: true,  // From SetAllValues default (gc_Curved.Value = True)
            manFlow: 96,
            noInValves: 1,
            valveDia: 2.05,
            maxInFlow: 250,
            deltaP: 28,
            refBore: 4.0,
            deck: 0.015,
            gasket: 0.039,
            chamber: 62,
            dome: 12,
        };
        
        console.log('Testing BASECASE.ENG with VB6 defaults...');
        console.log('Inputs:', basecaseInputs);
        
        const result = calcEngPerf(basecaseInputs);
        console.log('Result:', result);
        
        // VB6 Expected output from your screenshot
        const vb6 = {
            peakHP: 461,
            rpmPeakHP: 6650,
            peakTQ: 415,
            rpmPeakTQ: 5450,
            hpPerCID: 1.30,
            tqPerCID: 1.17,
            shift: 7200,
            redline: 8350,
        };
        
        let html = '<h2>Results Comparison</h2>';
        html += '<table>';
        html += '<tr><th>Metric</th><th>TypeScript</th><th>VB6 Expected</th><th>Difference</th><th>Status</th></tr>';
        
        const metrics = [
            { name: 'Peak HP', ts: Math.round(result.peakHP), vb6: vb6.peakHP, tol: 1 },
            { name: 'RPM @ Peak HP', ts: result.rpmPeakHP, vb6: vb6.rpmPeakHP, tol: 50 },
            { name: 'Peak TQ', ts: Math.round(result.peakTQ), vb6: vb6.peakTQ, tol: 1 },
            { name: 'RPM @ Peak TQ', ts: result.rpmPeakTQ, vb6: vb6.rpmPeakTQ, tol: 50 },
            { name: 'HP/CID', ts: result.hpPerCID.toFixed(2), vb6: vb6.hpPerCID.toFixed(2), tol: 0.01 },
            { name: 'TQ/CID', ts: result.tqPerCID.toFixed(2), vb6: vb6.tqPerCID.toFixed(2), tol: 0.01 },
            { name: 'Shift RPM', ts: result.shift, vb6: vb6.shift, tol: 50 },
            { name: 'Redline RPM', ts: result.redline, vb6: vb6.redline, tol: 50 },
        ];
        
        let allPass = true;
        metrics.forEach(m => {
            const diff = parseFloat(m.ts) - parseFloat(m.vb6);
            const pass = Math.abs(diff) <= m.tol;
            if (!pass) allPass = false;
            
            html += '<tr>';
            html += `<td>${m.name}</td>`;
            html += `<td>${m.ts}</td>`;
            html += `<td>${m.vb6}</td>`;
            html += `<td>${diff > 0 ? '+' : ''}${typeof m.ts === 'number' ? diff.toFixed(0) : diff}</td>`;
            html += `<td class="${pass ? 'pass' : 'fail'}">${pass ? '✓' : '✗'}</td>`;
            html += '</tr>';
        });
        
        html += '</table>';
        
        if (allPass) {
            html += '<h2 class="pass">✓ 100% VB6 PARITY ACHIEVED!</h2>';
        } else {
            html += '<h2 class="fail">✗ Discrepancies Found</h2>';
            html += '<h3>Analysis:</h3>';
            html += '<pre>';
            html += 'HP Deficit: ' + (Math.round(result.peakHP) - vb6.peakHP) + ' HP\n';
            html += 'TQ Deficit: ' + (Math.round(result.peakTQ) - vb6.peakTQ) + ' lb-ft\n';
            html += 'HP RPM Offset: ' + (result.rpmPeakHP - vb6.rpmPeakHP) + ' RPM\n';
            html += 'TQ RPM Offset: ' + (result.rpmPeakTQ - vb6.rpmPeakTQ) + ' RPM\n\n';
            html += 'Systematic error pattern suggests issue in core calculation.\n';
            html += 'Need to add VB6 debug output to compare intermediate values.\n';
            html += '</pre>';
        }
        
        document.getElementById('output').innerHTML = html;
    </script>
</body>
</html>
