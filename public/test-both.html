<!DOCTYPE html>
<html>
<head>
    <title>Engine Test - Both Configurations</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .result { margin: 10px 0; padding: 10px; background: #2d2d30; border-left: 3px solid #007acc; }
        .pass { border-left-color: #4ec9b0; }
        .fail { border-left-color: #f48771; }
        h2 { color: #4ec9b0; }
        .diff { color: #ce9178; font-weight: bold; }
        table { border-collapse: collapse; margin: 20px 0; width: 100%; }
        th, td { padding: 8px; text-align: left; border: 1px solid #444; }
        th { background: #2d2d30; }
    </style>
</head>
<body>
    <h1>Engine Performance Test - Both Configurations</h1>
    <div id="results"></div>
    
    <script type="module">
        const { calcEngPerf } = await import('/src/domain/physics/engine/enginePerf.ts');
        
        const baseInputs = {
            noCyl: 8,
            inline: 0,
            bore: 4.03,
            stroke: 3.48,
            rod: 5.85,
            compressionRatio: 12.9,
            camType: 4,
            inCamDur: 264,
            carb: true,
            carbCFM: 750,
            fuel: 1,
            manifold: 1,
            manFlow: 96,
            noInValves: 1,
            valveDia: 2.05,
            maxInFlow: 250,
            deltaP: 28,
            refBore: 4.0,
            deck: 0.015,
            gasket: 0.039,
            chamber: 62,
            dome: 12,
        };
        
        const straightResult = calcEngPerf({ ...baseInputs, curved: false });
        const curvedResult = calcEngPerf({ ...baseInputs, curved: true });
        
        const vb6Expected = {
            peakHP: 461,
            peakTQ: 415,
            rpmPeakHP: 6650,
            rpmPeakTQ: 5450,
        };
        
        let html = '<h2>TypeScript Results Comparison</h2>';
        html += '<table>';
        html += '<tr><th>Configuration</th><th>Peak HP</th><th>@ RPM</th><th>Peak TQ</th><th>@ RPM</th><th>Match VB6?</th></tr>';
        
        const straightMatch = Math.abs(Math.round(straightResult.peakHP) - vb6Expected.peakHP) <= 1 &&
                             Math.abs(Math.round(straightResult.peakTQ) - vb6Expected.peakTQ) <= 1;
        const curvedMatch = Math.abs(Math.round(curvedResult.peakHP) - vb6Expected.peakHP) <= 1 &&
                           Math.abs(Math.round(curvedResult.peakTQ) - vb6Expected.peakTQ) <= 1;
        
        html += '<tr>';
        html += '<td><strong>Straight Runners</strong></td>';
        html += `<td>${Math.round(straightResult.peakHP)}</td>`;
        html += `<td>${straightResult.rpmPeakHP}</td>`;
        html += `<td>${Math.round(straightResult.peakTQ)}</td>`;
        html += `<td>${straightResult.rpmPeakTQ}</td>`;
        html += `<td class="${straightMatch ? 'pass' : 'fail'}">${straightMatch ? '✓ MATCH' : '✗ NO MATCH'}</td>`;
        html += '</tr>';
        
        html += '<tr>';
        html += '<td><strong>Curved Runners</strong></td>';
        html += `<td>${Math.round(curvedResult.peakHP)}</td>`;
        html += `<td>${curvedResult.rpmPeakHP}</td>`;
        html += `<td>${Math.round(curvedResult.peakTQ)}</td>`;
        html += `<td>${curvedResult.rpmPeakTQ}</td>`;
        html += `<td class="${curvedMatch ? 'pass' : 'fail'}">${curvedMatch ? '✓ MATCH' : '✗ NO MATCH'}</td>`;
        html += '</tr>';
        
        html += '<tr style="background: #3a3a3a;">';
        html += '<td><strong>VB6 Expected</strong></td>';
        html += `<td>${vb6Expected.peakHP}</td>`;
        html += `<td>${vb6Expected.rpmPeakHP}</td>`;
        html += `<td>${vb6Expected.peakTQ}</td>`;
        html += `<td>${vb6Expected.rpmPeakTQ}</td>`;
        html += '<td>-</td>';
        html += '</tr>';
        
        html += '</table>';
        
        if (straightMatch) {
            html += '<h2 class="pass">✓ STRAIGHT RUNNERS MATCH VB6!</h2>';
            html += '<p>The VB6 test case uses <strong>straight runners</strong>, not curved runners.</p>';
        } else if (curvedMatch) {
            html += '<h2 class="pass">✓ CURVED RUNNERS MATCH VB6!</h2>';
            html += '<p>The VB6 test case uses <strong>curved runners</strong>.</p>';
        } else {
            html += '<h2 class="fail">✗ NEITHER CONFIGURATION MATCHES VB6</h2>';
            html += '<p>There is a calculation error beyond the curved runner setting.</p>';
            html += '<h3>Differences:</h3>';
            html += '<p>Straight: HP ' + (Math.round(straightResult.peakHP) - vb6Expected.peakHP) + ', TQ ' + (Math.round(straightResult.peakTQ) - vb6Expected.peakTQ) + '</p>';
            html += '<p>Curved: HP ' + (Math.round(curvedResult.peakHP) - vb6Expected.peakHP) + ', TQ ' + (Math.round(curvedResult.peakTQ) - vb6Expected.peakTQ) + '</p>';
        }
        
        document.getElementById('results').innerHTML = html;
        
        console.log('Straight runners:', straightResult);
        console.log('Curved runners:', curvedResult);
    </script>
</body>
</html>
